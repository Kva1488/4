name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo, selene, StyLua, Lune
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSL -o rojo.zip   https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          curl -sSL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.28.0/selene-0.28.0-linux.zip
          curl -sSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.2/stylua-linux-x86_64.zip
          curl -sSL -o lune.zip   https://github.com/lune-org/lune/releases/download/v0.8.9/lune-0.8.9-linux-x86_64.zip
          curl -sSL -o lsp.zip    https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.0/luau-lsp-linux-x86_64.zip
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.0/scripts/globalTypes.d.luau
          for f in *.zip; do unzip -o -q "$f"; done
          chmod +x rojo selene stylua lune luau-lsp
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Format check (StyLua)
        run: stylua --check src

      - name: Lint (selene)
        run: selene src

      - name: Type check against Roblox API (luau-lsp)
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions="$HOME/bin/globalTypes.d.luau" --sourcemap=sourcemap.json src

      - name: Build place (Rojo)
        run: rojo build -o Game.rbxl

      - name: Verify place and game data (Lune)
        run: lune run tools/verify.luau Game.rbxl

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: Game
          path: Game.rbxl
